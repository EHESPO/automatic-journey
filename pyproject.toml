[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eheps-gemini-background"
version = "0.1.0"
description = "EHEPS Gemini Background Interactions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.3.0"
]

[project.scripts]
eheps-gemini = "eheps_gemini.cli:main"

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
