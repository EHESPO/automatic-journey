name: Build and Deploy EHEPS to Google Cloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PROJECT_ID: ehepso-nonprofit-eb1db
  REGION: us-central1
  SERVICE_NAME: eheps-gemini
  IMAGE_NAME: eheps-gemini
  GAR_REPOSITORY: eheps
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install -e .
          python -m pip install pytest flake8

      - name: Syntax check
        run: |
          python -m compileall -q src

      - name: Lint
        run: |
          flake8 src tests \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      - name: Test
        run: |
          pytest -q

  build-and-deploy:
    name: Build and Deploy to Cloud Run
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            "${{ env.REGION }}-docker.pkg.dev" \
            --quiet

      - name: Create Artifact Registry repository if needed
        run: |
          gcloud artifacts repositories describe "${GAR_REPOSITORY}" \
            --location="${REGION}" \
            --project="${PROJECT_ID}" \
          || gcloud artifacts repositories create "${GAR_REPOSITORY}" \
            --repository-format=docker \
            --location="${REGION}" \
            --description="EHEPS container images" \
            --project="${PROJECT_ID}"

      - name: Build container
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build \
            --build-arg GITHUB_SHA="${GITHUB_SHA}" \
            --build-arg GITHUB_REF="${GITHUB_REF}" \
            -t "${IMAGE_URI}" .

      - name: Push container
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        env:
          IMAGE_URI: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image="${IMAGE_URI}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --platform=managed \
            --port=8080 \
            --execution-environment=gen2 \
            --no-allow-unauthenticated

      - name: Show deployment
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format="value(status.url)"
